<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Packet Cumulative Latency Animation</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }
  canvas {
    background-color: #f0f0f0;
    margin: 20px auto;
    display: block;
    border: 1px solid #ccc;
  }
  .buttons-container {
    margin: 15px auto;
    max-width: 900px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }
  button {
    background-color: #008CBA;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover {
    background-color: #005f75;
  }
</style>
</head>
<body>

<h2>Packet Animation with Cumulative Latency</h2>
<canvas id="networkCanvas" width="960" height="550"></canvas>

<div class="buttons-container">
  <button id="btnIndia">User Traffic</button>
  <button id="btnIndiaBrowser">Content Request</button>
</div>

<script>
  const canvas = document.getElementById('networkCanvas');
  const ctx = canvas.getContext('2d');

  // Adjusted positions with more horizontal space for labels
  const locations = {
    'India': { x: 80, y: 450 },
    'US East A': { x: 650, y: 150 },
    'US East B': { x: 650, y: 280 },
    'Landing Zone 1': { x: 850, y: 130 },
    'Landing Zone 2': { x: 850, y: 300 },
    'Browse India': { x: 80, y: 500 }
  };

  const segmentLatencies = {
    'India-US East A': 260,
    'US East A-Landing Zone 1': 9,
    'Landing Zone 1-Browse India': 200,
    'India-US East B': 260,
    'US East B-Landing Zone 2': 9,
    'Landing Zone 2-Browse India': 200,
  };

  const indiaPaths = {
    indiaA: ['India', 'US East A', 'Landing Zone 1', 'Browse India'],
    indiaB: ['India', 'US East B', 'Landing Zone 2', 'Browse India']
  };

  function drawRunner(ctx, x, y, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y - 10, 6, 0, Math.PI * 2);
    ctx.moveTo(x, y - 4);
    ctx.lineTo(x, y + 14);
    ctx.moveTo(x - 10, y + 4);
    ctx.lineTo(x + 10, y + 4);
    ctx.moveTo(x, y + 14);
    ctx.lineTo(x - 7, y + 30);
    ctx.moveTo(x, y + 14);
    ctx.lineTo(x + 7, y + 28);
    ctx.stroke();
  }

  function lerp(p1, p2, t) {
    return {
      x: p1.x + (p2.x - p1.x) * t,
      y: p1.y + (p2.y - p1.y) * t
    };
  }

  class Traveler {
    constructor(path, color, runnerOffset, labelPrefix) {
      this.path = path;
      this.color = color;
      this.segment = 0;
      this.progress = 0;
      this.runnerOffset = runnerOffset;
      this.labelPrefix = labelPrefix;
      this.totalLatencySoFar = 0;
    }

    update(deltaTime) {
      const from = this.path[this.segment];
      const to = this.path[this.segment + 1];
      const segmentKey = `${from}-${to}`;
      const latency = segmentLatencies[segmentKey] || 100;

      const speed = 1 / latency;

      this.progress += speed * deltaTime;
      if (this.progress >= 1) {
        this.progress = 0;
        this.segment++;
        if (this.segment >= this.path.length - 1) {
          this.segment = 0;
          this.totalLatencySoFar = 0;
        } else {
          this.totalLatencySoFar += latency;
        }
      }
    }

    draw(ctx) {
      const from = locations[this.path[this.segment]];
      const to = locations[this.path[this.segment + 1]];
      const pos = lerp(from, to, this.progress);

      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
      ctx.fill();

      drawRunner(ctx, pos.x, pos.y - this.runnerOffset, this.color);

      const fromLat = this.totalLatencySoFar;
      const segmentKey = `${this.path[this.segment]}-${this.path[this.segment + 1]}`;
      const segmentLatency = segmentLatencies[segmentKey] || 100;
      const partialLatency = segmentLatency * this.progress;
      const cumulativeLatency = Math.round(fromLat + partialLatency);

      ctx.fillStyle = 'black';
      ctx.font = '16px Arial';
      ctx.fillText(`${this.labelPrefix} ${cumulativeLatency} ms`, pos.x + 12, pos.y);
    }
  }

  const travelers = [
    new Traveler(indiaPaths.indiaA, 'red', 40, 'India A:'),
    new Traveler(indiaPaths.indiaB, 'darkred', 40, 'India B:')
  ];

  function drawLocations() {
    ctx.fillStyle = 'black';
    ctx.font = '18px Arial';
    for (const [name, loc] of Object.entries(locations)) {
      ctx.beginPath();
      ctx.arc(loc.x, loc.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillText(name, loc.x + 10, loc.y + 7);
    }
  }

  function drawPaths() {
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 3;
    for (const path of Object.values(indiaPaths)) {
      ctx.beginPath();
      for (let i = 0; i < path.length - 1; i++) {
        const from = locations[path[i]];
        const to = locations[path[i + 1]];
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
      }
      ctx.stroke();
    }
  }

  let last = 0;
  function animate(time = 0) {
    const deltaTime = (time - last) / 16.67;
    last = time;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawPaths();
    drawLocations();

    travelers.forEach(traveler => {
      traveler.update(deltaTime);
      traveler.draw(ctx);
    });

    requestAnimationFrame(animate);
  }

  animate();

  // Example button click handlers (currently do nothing, can be customized)
  document.getElementById('btnIndia').addEventListener('click', () => {
    alert('India (User Location) button clicked');
  });
  document.getElementById('btnIndiaBrowser').addEventListener('click', () => {
    alert('India Browser (Content) button clicked');
  });
</script>

</body>
</html>
